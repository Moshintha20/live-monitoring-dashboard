<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Monitoring Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      padding: 2.5rem 3rem;
      border-radius: 16px;
      background: #1a1d24;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      color: #f2c14e;
    }
    p {
      margin: 0;
      color: #9aa0aa;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Live Monitoring Dashboard</h1>
    <p>Deployment pipeline is working. Gold rates coming next.</p>
  </div>
</body>
</html>
